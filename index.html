                <div class="bg-gray-900 rounded-lg overflow-hidden border border-gray-700">

    <footer class="bg-amazon-blue text-gray-400 text-xs text-center py-6 border-t border-gray-800 mt-12">

    <!-- Hinweis -->
    <script>
      if (location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', () => {
          const notice = document.createElement('div');
          notice.className = 'fixed top-20 left-1/2 -translate-x-1/2 z-[100] max-w-xl bg-red-900 text-white p-3 rounded shadow-lg text-sm';
          notice.textContent = 'Diese HTML-Datei bitte über HTTPS oder einen lokalen Server (z. B. VS Code Live Server) öffnen. Beim direkten Öffnen per Doppelklick blockiert der Browser die Firebase-Module; dadurch funktionieren die Buttons nicht.';
          document.body.appendChild(notice);
        });

    <!-- FIREBASE & JS -->
    <script>
        let initializeApp, getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, getDocs;
        let db = null, ordersRef = null, productsRef = null;

        const firebaseConfig = {
            apiKey: "AIzaSyDwBUR_Y7UDT6C8DDAIyKTFvDviHKlXy4U",
            authDomain: "mphl-60215.firebaseapp.com",
            projectId: "mphl-60215",
            storageBucket: "mphl-60215.firebasestorage.app",
            messagingSenderId: "979262600414",
            appId: "1:979262600414:web:9e643c6c85b5c133577e4f",
            measurementId: "G-8D706DJ0ZM"
        };

        let firebaseAvailable = false;

        // Passwortprüfung mit PBKDF2 (SHA-256), Salt und 310.000 Iterationen.
        const PASSWORD_SALT = "4f08a4c46ad0911db8d5bf100ac15b0f";
        const TARGET_HASH = "20589dc31af7867020816b8dfa74759cacf82feb2259ed628b40f8906193898b";

        async function hashPassword(password) {
            if (!globalThis.crypto?.subtle) {
                throw new Error("Web Crypto ist nicht verfügbar. Bitte HTTPS oder localhost verwenden.");
            }

            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                "raw",
                encoder.encode(password),
                "PBKDF2",
                false,
                ["deriveBits"]
            );

            const bits = await crypto.subtle.deriveBits({
                name: "PBKDF2",
                salt: Uint8Array.from(
                    PASSWORD_SALT.match(/../g),
                    byte => parseInt(byte, 16)
                ),
                iterations: 310000,
                hash: "SHA-256"
            }, keyMaterial, 256);

            return Array.from(
                new Uint8Array(bits),
                byte => byte.toString(16).padStart(2, "0")
            ).join("");
        }

        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');

            const bgClass = type === 'success'
                ? 'bg-green-700'
                : type === 'error'
                ? 'bg-red-700'
                : 'bg-amazon-light_blue border border-amazon-yellow';

            toast.className = `px-4 py-2.5 rounded-md shadow-2xl text-white text-xs font-semibold flex items-center gap-2 pointer-events-auto toast-animate ${bgClass}`;

            const symbol = document.createElement('span');
            symbol.textContent = type === 'success' ? '✅' : type === 'error' ? '⚠️' : '🔔';

            const messageText = document.createElement('span');
            messageText.textContent = String(message);

            toast.append(symbol, messageText);
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        const defaultProducts = [
            { name: "Diamant Schwert (Schärfe V)", category: "Waffen", price: 12, icon: "⚔️" },
            { name: "Netherit Rüstung Set", category: "Waffen", price: 64, icon: "🛡️" },
            { name: "Enderperlen (16x)", category: "Ressourcen", price: 4, icon: "🔮" },
            { name: "Bruchstein Stack (64x)", category: "Baustoffe", price: 1, icon: "🧱" },
            { name: "Trank der Heilung II", category: "Tränke", price: 3, icon: "🧪" },
            { name: "Goldene Äpfel (8x)", category: "Tränke", price: 16, icon: "🍎" },
            { name: "Elytra Flügel", category: "Waffen", price: 48, icon: "🪽" },
            { name: "Smaragd Block (5x)", category: "Ressourcen", price: 10, icon: "🟢" }
        ];

        let loadedProducts = defaultProducts.map((item, index) => ({
            ...item,
            id: `local-${index}`
        }));

        let loadedOrders = [];
        let cart = [];
        let isOwner = false;
        let unsubscribeOrders = null;

        async function initDB() {
            try {
                const snap = await getDocs(productsRef);

                if (snap.empty) {
                    for (const item of defaultProducts) {
                        await addDoc(productsRef, item);
                    }
                }
            } catch (err) {
                console.error("Init DB Error:", err);
            }
        }

        async function connectFirebase() {
            try {
                const appModule = await import(
                    "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"
                );

                const storeModule = await import(
                    "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
                );

                ({ initializeApp } = appModule);

                ({
                    getFirestore,
                    collection,
                    addDoc,
                    onSnapshot,
                    doc,
                    updateDoc,
                    deleteDoc,
                    getDocs
                } = storeModule);

                const app = initializeApp(firebaseConfig);

                db = getFirestore(app);
                ordersRef = collection(db, "orders");
                productsRef = collection(db, "products");

                firebaseAvailable = true;

                await initDB();
                startProductsListener();

            } catch (err) {
                firebaseAvailable = false;

                console.warn(
                    "Firebase nicht verfügbar; lokaler Vorschau-Modus aktiv:",
                    err
                );

                loadedProducts = defaultProducts.map((item, index) => ({
                    ...item,
                    id: `local-${index}`
                }));

                renderProducts(loadedProducts);

                showToast(
                    "Vorschau-Modus: Produkte sind sichtbar, Firebase ist nicht verbunden.",
                    "info"
                );
            }
        }

        function startProductsListener() {
            onSnapshot(productsRef, (snapshot) => {
                loadedProducts = [];

                snapshot.forEach(docSnap => {
                    loadedProducts.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });
                });

                if (snapshot.empty) {
                    loadedProducts = defaultProducts.map((item, index) => ({
                        ...item,
                        id: `local-${index}`
                    }));
                }

                renderProducts(loadedProducts);

                if (isOwner) {
                    renderOwnerProductsTable();
                    updateAnalytics();
                }

            }, (error) => {
                firebaseAvailable = false;

                console.error(
                    "Firestore Produkte konnten nicht geladen werden:",
                    error
                );

                loadedProducts = defaultProducts.map((item, index) => ({
                    ...item,
                    id: `local-${index}`
                }));

                renderProducts(loadedProducts);

                showToast(
                    "Datenbank nicht erreichbar – Standardprodukte werden lokal angezeigt.",
                    "error"
                );
            });
        }

        function listenToOrders() {
            if (unsubscribeOrders) unsubscribeOrders();

            unsubscribeOrders = onSnapshot(ordersRef, (snapshot) => {
                loadedOrders = [];

                snapshot.forEach(docSnap => {
                    loadedOrders.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });
                });

                if (isOwner) {
                    renderOwnerOrdersTable();
                    updateAnalytics();
                }
            });
        }

        window.renderProducts = function(itemsToRender = loadedProducts) {
            const grid = document.getElementById('productGrid');

            if (itemsToRender.length === 0) {
                grid.innerHTML = `<p class="text-gray-400 text-center col-span-full py-8">Keine Produkte gefunden.</p>`;
                return;
            }

            grid.innerHTML = itemsToRender.map(p => `
                <div class="bg-gray-800 border border-gray-700 rounded-lg p-4 flex flex-col justify-between hover:border-amazon-yellow transition shadow-md">
                    <div class="text-center py-4 bg-gray-900 rounded mb-3 text-4xl">${p.icon}</div>
                    <div>
                        <span class="text-[10px] text-amazon-yellow uppercase font-mono">${p.category}</span>
                        <h3 class="font-bold text-white text-md leading-tight mb-2">${p.name}</h3>
                        <p class="text-xl font-bold text-amazon-yellow mb-4">${p.price} 💎</p>
                    </div>
                    <button onclick="addToCart('${p.id}')" class="w-full bg-amazon-button hover:bg-amazon-button_hover text-black font-bold py-2 px-3 rounded text-sm transition">
                        In den Warenkorb
                    </button>
                </div>
            `).join('');
        };

        window.filterProducts = function() {
            const term = document.getElementById('searchInput').value.toLowerCase();

            const filtered = loadedProducts.filter(p =>
                p.name.toLowerCase().includes(term) ||
                p.category.toLowerCase().includes(term)
            );

            renderProducts(filtered);
        };

        window.filterProductsMobile = function() {
            const term = document.getElementById('mobileSearchInput').value.toLowerCase();

            const filtered = loadedProducts.filter(p =>
                p.name.toLowerCase().includes(term) ||
                p.category.toLowerCase().includes(term)
            );

            renderProducts(filtered);
        };

        window.filterCategory = function(cat) {
            if (cat === 'all') {
                renderProducts(loadedProducts);
            } else {
                const filtered = loadedProducts.filter(p => p.category === cat);
                renderProducts(filtered);
            }
        };

        window.showPage = function(page) {
            document.getElementById('page-shop').classList.add('hidden');
            document.getElementById('page-cart').classList.add('hidden');
            document.getElementById('page-owner').classList.add('hidden');

            if (page === 'owner' && !isOwner) {
                showToast("Bitte erst als Owner anmelden!", "error");
                showPage('shop');
                return;
            }

            document.getElementById(`page-${page}`).classList.remove('hidden');

            if (page === 'cart') renderCart();
        };

        window.addToCart = function(id) {
            const product = loadedProducts.find(p => p.id === id);

            if (product) {
                cart.push(product);
                updateCartCount();

                showToast(
                    `"${product.name}" wurde zum Warenkorb hinzugefügt!`,
                    "success"
                );
            }
        };

        function updateCartCount() {
            document.getElementById('cartCount').innerText = cart.length;
        }

        function renderCart() {
            const container = document.getElementById('cartItemsContainer');

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-8">Dein Warenkorb ist leer.</p>`;
                document.getElementById('cartTotalPrice').innerText = `0 💎`;
                return;
            }

            let total = 0;

            container.innerHTML = cart.map((item, index) => {
                total += Number(item.price);

                return `
                    <div class="flex items-center justify-between py-2">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">${item.icon}</span>
                            <div>
                                <h4 class="font-bold text-sm">${item.name}</h4>
                                <span class="text-xs text-amazon-yellow">${item.price} 💎</span>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-300 text-xs bg-red-900/30 px-2 py-1 rounded transition">Entfernen</button>
                    </div>
                `;
            }).join('');

            document.getElementById('cartTotalPrice').innerText = `${total} 💎`;
        }

        window.removeFromCart = function(index) {
            const removed = cart.splice(index, 1);

            updateCartCount();
            renderCart();

            if (removed[0]) {
                showToast(`"${removed[0].name}" entfernt.`, "info");
            }
        };

        window.checkout = async function() {
            const mcName = document.getElementById('customerMcName').value.trim();

            if (!mcName) {
                showToast("Bitte gib deinen Minecraft Namen im Feld oben ein!", "error");
                return;
            }

            if (cart.length === 0) {
                showToast("Dein Warenkorb ist leer!", "error");
                return;
            }

            const total = cart.reduce(
                (sum, item) => sum + Number(item.price),
                0
            );

            const orderData = {
                customer: mcName,
                items: cart.map(i => i.name).join(", "),
                total: total,
                date: new Date().toLocaleString('de-DE'),
                status: "Offen",
                timestamp: Date.now()
            };

            try {
                if (!firebaseAvailable) {
                    throw new Error("Firestore ist nicht verfügbar");
                }

                await addDoc(ordersRef, orderData);

                showToast("Bestellung erfolgreich abgesendet!", "success");

                cart = [];
                updateCartCount();
                showPage('shop');

            } catch (error) {
                console.error("Fehler beim Senden der Bestellung:", error);

                showToast(
                    "Bestellung konnte nicht gespeichert werden. Bitte Datenbank/Internet prüfen.",
                    "error"
                );
            }
        };

        window.toggleOwnerLogin = function() {
            if (isOwner) {
                showPage('owner');
                return;
            }

            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('modalPasswordInput').value = '';
            document.getElementById('modalPasswordInput').focus();
        };

        window.closeLoginModal = function() {
            document.getElementById('loginModal').classList.add('hidden');
        };

        window.submitOwnerLogin = async function() {
            const input = document.getElementById('modalPasswordInput');
            const val = input.value;

            try {
                const inputHash = await hashPassword(val);

                if (inputHash === TARGET_HASH) {
                    isOwner = true;

                    document.getElementById('userStatusText').innerText = "Owner Dashboard";
                    document.getElementById('userStatusText').classList.add('text-amazon-yellow');

                    showToast("Erfolgreich als Owner angemeldet!", "success");

                    closeLoginModal();
                    showPage('owner');
                    renderOwnerProductsTable();
                    listenToOrders();

                    input.value = "";

                } else {
                    showToast("Falsches Passwort!", "error");
                    input.select();
                }

            } catch (error) {
                console.error("Anmeldefehler:", error);
                showToast(error.message || "Anmeldung fehlgeschlagen.", "error");
            }
        };

        window.logoutOwner = function() {
            isOwner = false;

            if (unsubscribeOrders) {
                unsubscribeOrders();
                unsubscribeOrders = null;
            }

            document.getElementById('userStatusText').innerText = "Anmelden (Owner)";
            document.getElementById('userStatusText').classList.remove('text-amazon-yellow');

            showToast("Erfolgreich abgemeldet.", "info");
            showPage('shop');
        };

        window.handleProductSubmit = async function(e) {
            e.preventDefault();

            const name = document.getElementById('prodName').value.trim();
            const category = document.getElementById('prodCategory').value;
            const price = Number(document.getElementById('prodPrice').value);
            const icon = document.getElementById('prodIcon').value.trim();

            try {
                if (!firebaseAvailable) {
                    throw new Error("Firestore ist nicht verfügbar");
                }

                await addDoc(productsRef, {
                    name,
                    category,
                    price,
                    icon
                });

                showToast("Neues Produkt erfolgreich hinzugefügt!", "success");
                document.getElementById('addProductForm').reset();

            } catch (err) {
                showToast(
                    "Produkt konnte nicht gespeichert werden: " + err.message,
                    "error"
                );
            }
        };

        function renderOwnerProductsTable() {
            const table = document.getElementById('ownerProductsTable');

            if (loadedProducts.length === 0) {
                table.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">Keine Produkte vorhanden.</td></tr>`;
                return;
            }

            table.innerHTML = loadedProducts.map(p => `
                <tr class="hover:bg-gray-800">
                    <td class="p-3 text-2xl">${p.icon}</td>
                    <td class="p-3 font-bold text-white">${p.name}</td>
                    <td class="p-3 text-xs text-amazon-yellow">${p.category}</td>
                    <td class="p-3 font-bold text-green-400">${p.price} 💎</td>
                    <td class="p-3">
                        <button onclick="deleteProduct('${p.id}')" class="text-red-400 hover:text-red-300 bg-red-900/40 px-2.5 py-1 rounded text-xs transition">Löschen</button>
                    </td>
                </tr>
            `).join('');
        }

        window.deleteProduct = async function(id) {
            if (confirm("Produkt wirklich löschen?")) {
                try {
                    if (!firebaseAvailable) {
                        throw new Error("Firebase ist in dieser Vorschau nicht verbunden.");
                    }

                    await deleteDoc(doc(db, "products", id));
                    showToast("Produkt gelöscht.", "info");

                } catch (err) {
                    showToast("Fehler beim Löschen.", "error");
                }
            }
        };

        function renderOwnerOrdersTable(ordersToRender = loadedOrders) {
            const table = document.getElementById('ownerOrdersTable');

            if (ordersToRender.length === 0) {
                table.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Keine Bestellungen vorhanden.</td></tr>`;
                return;
            }

            table.innerHTML = ordersToRender.map(o => `
                <tr class="hover:bg-gray-800">
                    <td class="p-3 font-mono font-bold text-white">${o.customer}</td>
                    <td class="p-3 text-xs text-gray-300">${o.items}</td>
                    <td class="p-3 font-bold text-amazon-yellow">${o.total} 💎</td>
                    <td class="p-3 text-xs text-gray-400">${o.date}</td>
                    <td class="p-3 text-xs">
                        <span class="px-2 py-0.5 rounded font-bold ${o.status === 'Geliefert' ? 'bg-green-900/60 text-green-300' : 'bg-yellow-900/60 text-yellow-300'}">
                            ${o.status}
                        </span>
                    </td>
                    <td class="p-3 flex gap-2">
                        ${o.status !== 'Geliefert' ? `<button onclick="markOrderDelivered('${o.id}')" class="bg-green-700 hover:bg-green-600 text-white px-2 py-1 rounded text-xs font-bold transition">Liefern</button>` : ''}
                        <button onclick="deleteOrder('${o.id}')" class="bg-red-900/40 hover:bg-red-800 text-red-300 px-2 py-1 rounded text-xs transition">Löschen</button>
                    </td>
                </tr>
            `).join('');
        }

        window.filterOrdersTable = function() {
            const term = document.getElementById('orderSearchInput').value.toLowerCase();

            const filtered = loadedOrders.filter(o =>
                o.customer.toLowerCase().includes(term)
            );

            renderOwnerOrdersTable(filtered);
        };

        window.markOrderDelivered = async function(id) {
            try {
                if (!firebaseAvailable) {
                    throw new Error("Firebase ist nicht verbunden.");
                }

                await updateDoc(doc(db, "orders", id), {
                    status: "Geliefert"
                });

                showToast("Bestellung als geliefert markiert!", "success");

            } catch (err) {
                showToast("Fehler beim Aktualisieren.", "error");
            }
        };

        window.deleteOrder = async function(id) {
            if (confirm("Bestellung löschen?")) {
                try {
                    if (!firebaseAvailable) {
                        throw new Error("Firebase ist nicht verbunden.");
                    }

                    await deleteDoc(doc(db, "orders", id));
                    showToast("Bestellung gelöscht.", "info");

                } catch (err) {
                    showToast("Fehler beim Löschen.", "error");
                }
            }
        };

        document.getElementById('modalPasswordInput').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') window.submitOwnerLogin();
            if (event.key === 'Escape') window.closeLoginModal();
        });

        function updateAnalytics() {
            document.getElementById('statTotalOrders').innerText = loadedOrders.length;

            const revenue = loadedOrders.reduce(
                (sum, o) => sum + Number(o.total || 0),
                0
            );

            document.getElementById('statTotalRevenue').innerText = `${revenue} 💎`;

            const pending = loadedOrders.filter(
                o => o.status !== 'Geliefert'
            ).length;

            document.getElementById('statPendingOrders').innerText = pending;
            document.getElementById('statTotalProducts').innerText = loadedProducts.length;
        }

        // Oberfläche sofort initialisieren, Firebase danach im Hintergrund verbinden.
        renderProducts(loadedProducts);
        connectFirebase();
    </script>
</body>
